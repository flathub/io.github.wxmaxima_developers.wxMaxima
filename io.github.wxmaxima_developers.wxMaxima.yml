app-id: io.github.wxmaxima_developers.wxMaxima
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: wxmaxima
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=home:rw
  - --share=network
  - --env=PATH=/usr/bin:/app/bin:/app/plugins/maxima/bin

add-extensions:
  io.github.wxmaxima_developers.wxMaxima.Plugin:
    versions: stable;test;master
    directory: plugins
    subdirectories: true
    no-autodownload: false
    autodelete: true
    add-ld-path: lib

cleanup-commands:
  - rm -r /app/include

modules:
  - name: extensions
    buildsystem: simple
    build-commands:
      - install -d /app/plugins

  - name: wxwidgets
    buildsystem: autotools
    no-autogen: true
    config-opts:
      - --with-gtk=3
      - --enable-webview
      - --enable-webviewwebkit
    sources:
      - type: archive
        url: https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.12/wxWidgets-3.2.12.tar.bz2
        sha256: a62719bb5e1dcc41c1a6fc1eecd499c7ee8521f70402c7b1bb3342a1e16344e0
        x-checker-data:
          type: anitya
          project-id: 5150
          stable-only: true
          url-template: https://github.com/wxWidgets/wxWidgets/releases/download/v$version/wxWidgets-$version.tar.bz2
  - name: gnuplot
    buildsystem: autotools
    no-autogen: true
    config-opts:
      - --with-qt=no
      - --with-wx=/app/bin
      - --without-latex
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/gnuplot/6.0.6/gnuplot-6.0.6.tar.gz
        sha256: 9d39d8499c9533550144092375aac45ba8bf0c18c9cee50897fe411b6d93004e
        x-checker-data:
          type: anitya
          project-id: 1216
          url-template: https://prdownloads.sourceforge.net/gnuplot/$version/gnuplot-$version.tar.gz
  - name: wxmaxima
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DwxWidgets_INCLUDE_DIRS=/app/include/wx-3.2
      - -DwxWidgets_LIBRARIES=/app/lib
      - -DWXM_DISABLE_WEBVIEW=OFF
      - -DCMAKE_BUILD_TYPE=Release
    post-install:
      - rm -r /app/share/icons/hicolor/1024x1024
    sources:
      - type: git
        url: https://github.com/wxMaxima-developers/wxmaxima.git
        tag: Version-26.10.0
        commit: e613aba2bdc7a123f4b57ca7a5468ce57920030a
        x-checker-data:
          type: git
          is-main-source: true
          is-important: true
          tag-pattern: ^Version-([\d.]+)$
