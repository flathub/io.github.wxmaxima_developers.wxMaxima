app-id: io.github.wxmaxima_developers.wxMaxima
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: wxmaxima
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=home:rw
  - --share=network
  - --env=PATH=/usr/bin:/app/bin:/app/plugins/maxima/bin
  
add-extensions:
  io.github.wxmaxima_developers.wxMaxima.Plugin:
    versions: stable;test;master
    directory: plugins
    subdirectories: true
    no-autodownload: false
    autodelete: true
    add-ld-path: lib
    
cleanup-commands:
  - rm -r /app/include

modules:
  - name: extensions
    buildsystem: simple
    build-commands:
      - install -d /app/plugins
        
  - name: wxwidgets
    buildsystem: autotools
    no-autogen: true
    config-opts:
      - --with-gtk=3
      - --enable-webview
      - --enable-webviewwebkit
    sources:
      - type: archive
        url: https://github.com/wxWidgets/wxWidgets/releases/download/v3.3.3/wxWidgets-3.3.3.tar.bz2
        sha256: 81b09d6dd9f1ed9301f8c55a968a488d0491f264dc2bab19a7e407ac67009482
        x-checker-data:
          type: anitya
          project-id: 5150
          stable-only: true
          url-template: https://github.com/wxWidgets/wxWidgets/releases/download/v$version/wxWidgets-$version.tar.bz2
  - name: gnuplot
    buildsystem: autotools
    no-autogen: true
    config-opts:
      - --with-qt=no
      - --with-wx=/app/bin
      - --without-latex  
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/gnuplot/6.0.4/gnuplot-6.0.4.tar.gz
        sha256: 458d94769625e73d5f6232500f49cbadcb2b183380d43d2266a0f9701aeb9c5b
        x-checker-data:
          type: anitya
          project-id: 1216
          url-template: https://prdownloads.sourceforge.net/gnuplot/$version/gnuplot-$version.tar.gz
  - name: wxmaxima
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DwxWidgets_INCLUDE_DIRS=/app/include/wx-3.2 
      - -DwxWidgets_LIBRARIES=/app/lib
      - -DWXM_DISABLE_WEBVIEW=OFF
      - -DCMAKE_BUILD_TYPE=Release
    post-install:
      - rm -r /app/share/icons/hicolor/1024x1024
    sources:
      - type: git
        url: https://github.com/wxMaxima-developers/wxmaxima.git
        tag: Version-26.07.1
        commit: 3ce295a6f70d3deed73f6485c7b78b7b8311bd40
        x-checker-data:
          type: git
          is-main-source: true
          tag-pattern: ^Version-([\d.]+)$
