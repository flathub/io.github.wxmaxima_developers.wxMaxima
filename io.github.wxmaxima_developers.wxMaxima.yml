app-id: io.github.wxmaxima_developers.wxMaxima
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: wxmaxima
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=home:rw
  - --share=network
  - --env=PATH=/usr/bin:/app/bin:/app/plugins/maxima/bin
  
add-extensions:
  io.github.wxmaxima_developers.wxMaxima.Plugin:
    versions: stable;test;master
    directory: plugins
    subdirectories: true
    no-autodownload: false
    autodelete: true
    add-ld-path: lib
    
cleanup-commands:
  - rm -r /app/include

modules:
  - name: extensions
    buildsystem: simple
    build-commands:
      - install -d /app/plugins
        
  - name: wxwidgets
    buildsystem: autotools
    no-autogen: true
    config-opts:
      - --with-gtk=3
      - --enable-webview
      - --enable-webviewwebkit
    sources:
      - type: git
        url: https://github.com/wxWidgets/wxWidgets.git
        commit: db1005db3dea2c37a46fb455a9a02e37aa360751
        tag: v3.3.2
  - name: gnuplot
    buildsystem: autotools
    no-autogen: true
    config-opts:
      - --with-qt=no
      - --with-wx=/app/bin
      - --without-latex  
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/gnuplot/6.0.4/gnuplot-6.0.4.tar.gz
        sha256: 458d94769625e73d5f6232500f49cbadcb2b183380d43d2266a0f9701aeb9c5b
  - name: wxmaxima
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DwxWidgets_INCLUDE_DIRS=/app/include/wx-3.2 
      - -DwxWidgets_LIBRARIES=/app/lib
      - -DWXM_DISABLE_WEBVIEW=OFF
      - -DCMAKE_BUILD_TYPE=Release
    post-install:
      - rm -r /app/share/icons/hicolor/1024x1024
    sources:
      - type: git
        url: https://github.com/wxMaxima-developers/wxmaxima.git
        tag: Version-26.07.0
        commit: 1870598278603d83bc73c4269a0399378f623094
